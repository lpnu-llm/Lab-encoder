<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#334155"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="18" fill="#172033"><text x="30" y="35" font-size="24" fill="#172033">Residual: y = x + αF(x)</text><rect x="270" y="145" width="170" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="310" y="184" font-size="24" fill="#172033">αF(x)</text><text x="60" y="184" font-size="24" fill="#172033">x</text><line x1="90" y1="177" x2="270" y2="177" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="177" x2="620" y2="177" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><circle cx="645" cy="177" r="24" fill="#dcfce7" stroke="#15803d"/><text x="637" y="185" font-size="26" fill="#172033">+</text><line x1="669" y1="177" x2="800" y2="177" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="815" y="184" font-size="24" fill="#172033">y</text><path d="M160 177 V85 H645 V150" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="75" font-size="18" fill="#172033">shortcut: identity</text><text x="90" y="275" font-size="23" fill="#172033">Backward: gₓ = gᵧ + α Jꜰᵀ gᵧ</text><text x="90" y="315" font-size="18" fill="#172033">Два шляхи → сума внесків у градієнт входу.</text><text x="90" y="350" font-size="18" fill="#172033">Нульова гілка F(x) = 0 → вихід y = x.</text></g></svg>